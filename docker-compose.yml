# rtSD Explorer — three runtimes, one image.
#
# Quickstart:
#   docker compose up shiny       # Shiny app at http://localhost:3838
#   docker compose up marimo      # marimo notebook at http://localhost:2718
#   docker compose run --rm validate
#
# Source code is bind-mounted so edits to R/ or python/ are picked up on
# the next reload without rebuilding the image.

services:
  shiny:
    build: .
    image: rtsd:latest
    container_name: rtsd-shiny
    ports:
      - "3838:3838"
    volumes:
      - .:/rtsd
    command: >
      R -e "shiny::runApp('inst/shiny/rtsd',
            host = '0.0.0.0', port = 3838)"

  marimo:
    build: .
    image: rtsd:latest
    container_name: rtsd-marimo
    ports:
      - "2718:2718"
    volumes:
      - .:/rtsd
    command: >
      python3 -m marimo edit
      --host 0.0.0.0 --port 2718 --headless --no-token
      python/rtsd/rtsd.py

  validate:
    build: .
    image: rtsd:latest
    container_name: rtsd-validate
    volumes:
      - .:/rtsd
    command: Rscript tests/validate_reference_modes.R

  # Regenerate the R golden trajectories (deSolve, the authoritative reference).
  # Run only when the model equations change. Writes tests/parity/golden/*.csv.
  parity-golden:
    build: .
    image: rtsd:latest
    container_name: rtsd-parity-golden
    volumes:
      - .:/rtsd
    command: Rscript tests/parity/generate_golden.R

  # Run the Python<->R parity gate against the committed goldens.
  # (Also runnable on the host: `python -m pytest tests/parity`.)
  parity:
    build: .
    image: rtsd:latest
    container_name: rtsd-parity
    volumes:
      - .:/rtsd
    command: python3 -m pytest tests/parity -v
