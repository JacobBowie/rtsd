# Netlify build for rtSD Explorer (marimo WASM static bundle).
#
# The build inlines local modules (model.py, sd_diagram.py) into a
# self-contained notebook, then exports to WASM — see python/rtsd/build_wasm.py
# and docs/handoff_netlify_deploy_2026_05_28.md. marimo export html-wasm does
# NOT bundle sibling imports on its own (marimo issue #5488).
#
# marimo is pinned to ==0.23.3 (not merely >=0.23.0) so the Netlify build's
# Pyodide/Altair runtime stack matches build_wasm.py + the local build EXACTLY
# (marimo 0.23.3 → Pyodide 0.27.5 → Altair 5.4.1). A looser floor lets pip pull
# a newer marimo whose Pyodide bundles a different Altair, re-triggering the
# v5/v6 theme-API skew that blanked the v0.2.0 bundle in-browser. See CLAUDE.md
# → "marimo notebook". 0.23.3 also clears the actively-exploited pre-auth RCE
# CVE-2026-39987 (WASM static exports have no server and aren't themselves
# affected, but the build environment must still use a patched version).

[build]
  command = "pip install 'marimo==0.23.3' numpy pandas altair matplotlib && python python/rtsd/build_wasm.py --export"
  publish = "python/rtsd/build/wasm"

[build.environment]
  PYTHON_VERSION = "3.12"

# Pyodide loads .wasm assets; serve them with the correct MIME type.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
